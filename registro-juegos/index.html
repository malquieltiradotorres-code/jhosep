<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo de Juegos</title>
<style>
  :root{
    --felt:#0f5132; --felt2:#0b3d26; --wood:#5b3a1e; --cream:#fdf8ec; --ink:#1b1b1b; --muted:#6b6455;
    --gold:#f5c542; --red:#c62828; --blue:#1d4ed8; --ok:#14532d; --err:#991b1b;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 "Trebuchet MS",system-ui,sans-serif;
    background:
      radial-gradient(circle at 20% 10%,rgba(255,255,255,.08),transparent 40%),
      repeating-linear-gradient(45deg,var(--felt) 0 14px,var(--felt2) 14px 28px);}
  .wrap{max-width:1040px;margin:0 auto;padding:16px}

  /* Título */
  header{background:var(--wood);border:4px solid var(--gold);border-radius:16px;padding:14px 18px;margin-bottom:18px;
    text-align:center;color:var(--cream);box-shadow:0 6px 0 rgba(0,0,0,.35)}
  header h1{margin:0;font-size:clamp(1.4rem,4vw,2.1rem);letter-spacing:1px;text-transform:uppercase}
  header .icons{font-size:1.6rem;letter-spacing:10px}
  header p{margin:4px 0 0;opacity:.9}

  .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}
  @media (max-width:780px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--cream);border:4px solid var(--wood);border-radius:16px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
  h2{margin:0 0 12px;font-size:1.15rem;text-transform:uppercase;letter-spacing:.5px}
  .games{display:grid;gap:14px}

  /* Tarjetas de juego */
  .game{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    font:inherit;color:#fff;border:4px solid transparent;border-radius:14px;padding:14px;min-height:96px;
    box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .12s}
  .game:hover{transform:translateY(-2px)}
  .game b{display:block;font-size:1.3rem;text-transform:uppercase;letter-spacing:1px}
  .game small{opacity:.9}
  .game .chk{position:absolute;right:12px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#000;
    font-weight:900;display:none;place-items:center}
  .game[aria-checked="true"]{border-color:var(--gold);transform:scale(1.02)}
  .game[aria-checked="true"] .chk{display:grid}
  .ico{flex:none;width:68px;height:68px;display:grid;place-items:center}

  /* Ajedrez: tablero */
  .game[data-game="Ajedrez"]{background:
    conic-gradient(#2b2b2b 25%,#5a5a5a 0 50%,#2b2b2b 0 75%,#5a5a5a 0) 0 0/40px 40px}
  .game[data-game="Ajedrez"] .ico{background:rgba(0,0,0,.65);border-radius:12px;font-size:2.6rem}
  .game[data-game="Ajedrez"] span:last-child{background:rgba(0,0,0,.65);padding:6px 12px;border-radius:10px}

  /* Dominó: ficha */
  .game[data-game="Dominó"]{background:#2a2a2a}
  .tile{width:68px;height:68px;background:#fffdf5;border-radius:8px;border:3px solid #111;display:grid;grid-template-rows:1fr 2px 1fr}
  .tile hr{margin:0;border:0;background:#111}
  .half{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px}
  .half i{width:9px;height:9px;border-radius:50%;background:#111;place-self:center}
  .game[data-game="Dominó"] span:last-child{color:#fff}

  /* Bingo: bola */
  .game[data-game="Bingo"]{background:linear-gradient(135deg,#7f1d1d,#c62828)}
  .ball{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ffe9a8 45%,#e0a800);
    display:grid;place-items:center;color:#7f1d1d;font-weight:900;border:3px solid #fff;box-shadow:inset -4px -4px 8px rgba(0,0,0,.25)}
  .ball span{background:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:1.05rem}

  /* Formulario */
  label{display:block;font-weight:700;margin:0 0 4px}
  .field{margin-bottom:14px}
  input[type=text]{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:#fff;border:3px solid var(--wood);border-radius:10px}
  input:focus{outline:none;border-color:var(--blue)}
  .chosen{padding:11px 12px;border:3px dashed #b9ae94;border-radius:10px;color:var(--muted)}
  .chosen.has{border:3px solid var(--gold);background:#fff7d6;color:var(--ink);font-weight:800}
  button.go{width:100%;padding:15px;font:inherit;font-weight:900;font-size:1.15rem;letter-spacing:1px;text-transform:uppercase;
    color:#000;background:var(--gold);border:4px solid var(--wood);border-radius:12px;cursor:pointer;box-shadow:0 5px 0 var(--wood)}
  button.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--wood)}
  button.go:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:14px;padding:12px;border-radius:10px;display:none;font-weight:700}
  .msg.ok{display:block;background:#d1fae5;color:var(--ok)}
  .msg.err{display:block;background:#fee2e2;color:var(--err)}
  .note{color:var(--muted);font-size:.85rem;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="icons" aria-hidden="true">♞ ▯▯ ⓑ</div>
    <h1>Torneo de Juegos</h1>
    <p>Elige <strong>un solo juego</strong>, llena tus datos y pulsa <em>Participar</em>.</p>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="t-juegos">
      <h2 id="t-juegos">1. Elige tu juego</h2>
      <div class="games" role="radiogroup" aria-label="Tipo de juego">
        <button type="button" class="game" role="radio" aria-checked="false" data-game="Ajedrez">
          <span class="chk">✓</span><span class="ico">♞</span><span><b>Ajedrez</b><small>Estrategia 1 contra 1</small></span></button>
        <button type="button" class="game" role="radio" aria-checked="false" data-game="Dominó">
          <span class="chk">✓</span>
          <span class="ico"><span class="tile">
            <span class="half"><i style="grid-area:1/1"></i><i style="grid-area:2/2"></i><i style="grid-area:3/3"></i></span><hr>
            <span class="half"><i style="grid-area:1/1"></i><i style="grid-area:1/3"></i><i style="grid-area:3/1"></i><i style="grid-area:3/3"></i></span>
          </span></span>
          <span><b>Dominó</b><small>Parejas o individual</small></span></button>
        <button type="button" class="game" role="radio" aria-checked="false" data-game="Bingo">
          <span class="chk">✓</span><span class="ico"><span class="ball"><span>B7</span></span></span><span><b>Bingo</b><small>Suerte y atención</small></span></button>
      </div>
    </section>

    <section class="panel" aria-labelledby="t-datos">
      <h2 id="t-datos">2. Tus datos</h2>
      <form id="f" novalidate>
        <div class="field"><label for="nombre">Nombre y apellido</label><input id="nombre" type="text" autocomplete="name" required></div>
        <div class="field"><label for="ficha">Número de ficha</label><input id="ficha" type="text" inputmode="numeric" required></div>
        <div class="field"><label for="doc">Número de documento</label><input id="doc" type="text" inputmode="numeric" required></div>
        <div class="field"><label>Juego seleccionado</label><div id="chosen" class="chosen">Ninguno todavía</div></div>
        <button class="go" id="go" type="submit">¡Participar!</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
        <p class="note">Cada persona solo puede inscribirse en un juego.</p>
      </form>
    </section>
  </div>
</div>

<script>
/* ===== CONFIGURACIÓN (ver README.md) =====
   FORM_URL: URL del Google Form terminada en /formResponse
   ENTRY:    ids "entry.XXXX" de cada pregunta del formulario
   CHECK_URL: (opcional) URL del Apps Script que revisa duplicados en la hoja */
const CONFIG = {
  FORM_URL: "https://docs.google.com/forms/d/e/PEGA_AQUI_EL_ID_DEL_FORM/formResponse",
  ENTRY: { nombre:"entry.1111111111", ficha:"entry.2222222222", documento:"entry.3333333333", juego:"entry.4444444444" },
  CHECK_URL: ""
};

const $ = id => document.getElementById(id);
const msg = $("msg"), go = $("go");
let juego = "";
const KEY = "inscripciones_juegos";
const saved = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };

document.querySelectorAll(".game").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".game").forEach(x => x.setAttribute("aria-checked", x === b));
  juego = b.dataset.game;
  $("chosen").textContent = juego; $("chosen").classList.add("has");
}));

function show(type, text){ msg.className = "msg " + type; msg.textContent = text; }
const clean = v => v.trim().replace(/\s+/g, " ");

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const nombre = clean($("nombre").value), ficha = $("ficha").value.trim(), doc = $("doc").value.replace(/\D/g, "");
  if (!nombre.includes(" ")) return show("err", "Escribe nombre y apellido.");
  if (!ficha) return show("err", "Escribe tu número de ficha.");
  if (doc.length < 5) return show("err", "Revisa tu número de documento.");
  if (!juego) return show("err", "Elige un juego.");

  go.disabled = true; show("", ""); msg.className = "msg";
  try {
    // 1) Ya inscrito en este dispositivo
    const prev = saved().find(r => r.doc === doc || r.ficha === ficha);
    if (prev) return show("err", `Ya estás inscrito en ${prev.juego}. Solo se permite un juego por persona.`);

    // 2) Ya inscrito en la hoja de respuestas (si hay Apps Script)
    if (CONFIG.CHECK_URL) {
      const r = await fetch(`${CONFIG.CHECK_URL}?documento=${encodeURIComponent(doc)}&ficha=${encodeURIComponent(ficha)}`);
      const j = await r.json();
      if (j.existe) return show("err", `Ya estás inscrito en ${j.juego || "otro juego"}. Solo se permite un juego por persona.`);
    }

    // 3) Enviar al Google Form
    const body = new FormData();
    body.append(CONFIG.ENTRY.nombre, nombre);
    body.append(CONFIG.ENTRY.ficha, ficha);
    body.append(CONFIG.ENTRY.documento, doc);
    body.append(CONFIG.ENTRY.juego, juego);
    await fetch(CONFIG.FORM_URL, { method:"POST", mode:"no-cors", body });

    const list = saved(); list.push({ doc, ficha, juego });
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {}
    show("ok", `¡Listo ${nombre.split(" ")[0]}! Quedaste inscrito en ${juego}.`);
    $("f").reset(); juego = ""; $("chosen").textContent = "Ninguno todavía"; $("chosen").classList.remove("has");
    document.querySelectorAll(".game").forEach(x => x.setAttribute("aria-checked", "false"));
  } catch (err) {
    show("err", "No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.");
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
